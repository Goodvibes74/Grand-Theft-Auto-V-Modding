IniError=Falha na leitura do arquivo de inicialização.
UnsupportedArch=Arquitetura do sistema operacional sem suporte. O jogo só roda em Windows de 64 bits.
IntroPart1=BattlEye é um software antitrapaça usado em jogos multijogador online que impede e detecta ativamente trapaças e proíbe trapaceiros de jogar em servidores protegidos pelo BattlEye.\n\nPara atingir seu objetivo, o BattlEye instala um serviço de sistema que só está ativo enquanto o jogo está sendo executado. O serviço do sistema BattlEye também instala e carrega temporariamente um driver do modo kernel.\n\nEmbora devido a sua natureza o BattlEye precise ter acesso a grandes partes de seu sistema, ele garante que sua privacidade não seja violada.\nO BattlEye não está interessado em seus dados pessoais (documentos, senhas, detalhes de cartão de crédito etc.) nem em qualquer outra informação que seja privada para você como indivíduo.\nTudo o que o BattlEye faz é para atingir o objetivo de prevenir e detectar fraudes.
IntroPart2=Para ver o EULA, instalar o BattlEye e poder jogar em servidores protegidos pelo BattlEye, clique em "Instalar" abaixo. Caso contrário, clique em "Cancelar" para prosseguir sem o BattlEye.
IntroPart2Alt=Observação: o BattlEye é necessário para jogar o jogo. Para ver o EULA e instalar o BattlEye, clique em "Instalar" abaixo. Caso contrário, clique em "Cancelar".
