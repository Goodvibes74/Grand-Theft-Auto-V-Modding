; PhoneGuard settings. Edit with the game closed, or press F4 in game and type Reload().
; PhoneGuard has no menu of its own. It keeps the phone shut while a TrainerV or Menyoo menu is open,
; because D-pad up (and the Up arrow) both scroll those menus and open the phone.

[Keys]
; Keyboard keys that open and close the trainers. Must match trainerv.ini (MenuKey=114 is F3)
; and menyooStuff/menyooConfig.ini (open_key = 119 is F8). Gamepad combos are fixed:
; TrainerV RB + X, Menyoo RB + D-pad Left.
TrainerVKey=F3
MenyooKey=F8

[Timing]
; After a back press (B, Backspace, Num 0) with no menu input for this long, the menu counts as closed.
BackCloseMs=3000
; With no menu input at all for this long, the menu counts as closed.
IdleCloseMs=20000
