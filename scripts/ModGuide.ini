; Mod Guide: in-game list of every installed mod and how to use it.
; The mod list itself is in ModGuide.xml next to this file.
; Edit with the game closed, or press F4 and type Reload() in the SHVDN console.

[Keys]
; Keyboard key that opens and closes the guide. A .NET Keys name (F12, NumPad5, OemSemicolon, ...).
; F2 to F11 are taken by other mods, see docs/mods_info/HOTKEYS.md.
MenuKey=F12

; Controller combo: hold ControllerHold, then press ControllerPress.
; GTA control names from SHVDN's Control enum. FrontendRb = RB / R1, FrontendDown = D-pad Down.
ControllerHold=FrontendRb
ControllerPress=FrontendDown

[Display]
; Which controller names to show when you open the guide with a controller: Xbox or PlayStation.
ControllerType=Xbox
