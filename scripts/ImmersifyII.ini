[General]
MOD_ENABLED=true
PROCESSED_NPC_LIMIT=15                    // Maximum number of NPCs processed at a time by the mod.
DISABLE_DURING_MISSION=true               // Disable the mod during missions.
GANG_COLORED_BLIPS=true                   // Blips on the map are colored based on gang affiliation.
DYNAMIC_WEAPONS=true                      // NPCs have different weapons based on rarity (e.g., AK - rare, SMG - less common, Pistol - common). !If you play with a Hoodcore mod make sure to disable it in Hoodcore.ini
HIDE_BLIPS=false                          // Hide blips on the map (false means blips are shown).
TRAFFIC_ACCIDENT_REPORT_CHANCE=25         // Chance that an NPC will start reporting an accident.
PED_CHANCE_TO_SURRENDER_VEHICLE=50        // Chance that an NPC will surrender their vehicle when threatened.
DISABLE_NOTIFICATIONS=false               // Disable in-game notifications (false means notifications are enabled).
ENABLE_PED_GROUPS_BLIPS=false             // Enable blips for groupped peds.
ENABLE_PED_GROUPS=true                    // Enable groupped peds.
MOD_TOGGLE_KEY=None                       // Key to toggle the mod on or off.
FASTER_TRAFFIC_SPEEDS=true                // Traffic speeds closer to speed limits [Advanced only]
DLC_VEHICLES_IN_TRAFFIC=true              // Spawn DLC vehciles in traffic [Advanced only]
PROCESS_EACH_NUMBER_OF_TICKS=10
PROCESS_TIME_EQUALS_FPS=false

[NpcCombat]
FLEE_CHANCE=25                            // [Standard only] Chance for NPCs to flee when health is low. In Advanced, the morale system decides flee vs surrender instead and this is ignored.
DISARM_CHANCE=50                          // Chance for NPCs to drop their wepons if hit in hand.
WRITHE_IF_LOW_HP_CHANCE=30                // Chance for NPCs to writhe if their health is low.
ENEMIES_PERSISTANCE_DISTANCE=100          // Enemies despawn distance.
ALWAYS_SHOW_BLIP_HEADING=true             // Always show the heading direction of blips on the map.
REINFORCEMENTS_ENABLED=true               // Enable reinforcements for NPCs during combat.
REINFORCEMENT_VEHICLES_ONLY=false         // Reinforcements will only arrive by vehicles.
REINFORCEMENTS_SPAWN_CHANCE_PERCENT=50    // Chance to spawn reinforcements.
PREVENT_ANIMAL_ATTACKS=false              // Prevent animals from attacking player
DISPLAY_PERSONALITY_BLIPS=false           // Display enemy personality blips. (Red - aggressive. Yellow - coward. Blue - Tactical)
MORALE_ENABLED=true                       // Enemies lose morale as squadmates die / they get outgunned, then surrender or flee. Aggressive types never break.
MORALE_BREAK_THRESHOLD=25                  // Morale (0-100) at or below which an enemy breaks and surrenders/flees.
SURRENDER_CHANCE_PERCENT=50               // When an enemy breaks, base chance to surrender (hands up, robbable) vs flee. Cowards +25, Tactical -10.
MORALE_ENGAGEMENT_DISTANCE=50             // Enemies only lose morale / surrender within this many metres of the player.
MORALE_OUTGUNNED_LOSS_PER_TIER=5          // Extra morale lost per weapon-tier the player outclasses the enemy by (pistol vs rifle = 2 tiers). 0 disables.
SURRENDER_MAX_ALLIES=5                     // A broken enemy only surrenders when at most this many gang allies are still alive NEARBY (within MORALE_ENGAGEMENT_DISTANCE); otherwise they flee.
SURRENDER_ON_DISARM_CHANCE_PERCENT=50     // When an enemy is disarmed (shot in the hand), chance they surrender instead of fleeing.
MORALE_NEARBY_DEATH_RADIUS=10             // An ally dying within this many metres of an enemy gives that enemy an extra morale hit.
MORALE_NEARBY_DEATH_LOSS=30               // Extra morale lost (personality-scaled) when an ally dies within MORALE_NEARBY_DEATH_RADIUS. 0 disables.
RAPID_MORALE_LOSS_CHANCE_PERCENT=60       // Chance (rolled once per ped) that an enemy loses morale rapidly with damage taken. 0 disables.
RAPID_MORALE_LOSS_PER_HP=3                // For those peds, morale lost per HP point of damage taken (2 = 10 HP -> 20 morale).


[EnemiesSearch]
SEARCH_DURATION_SECONDS=120               // Duration (in seconds) that enemies will search for the player after losing sight.
PRECISE_SEARCH_START_SECONDS=7            // Time (in seconds) after losing sight before enemies begin a precise search.
WRONG_DIRECTION_DURATION_SECONDS=5        // Time (in seconds) that NPCs will search in the wrong direction.
ENEMY_FOV=75                              // Field of view angle for enemies searching for the player.
STEALTH_ENEMY_BLIPS_OPACITY=60            // Whenever enemy is in stealth mod and not in player vision their blip will become transparent (Values [0-255])

[DynamicEvents]
MINUTES_BETWEEN_ALL_EVENTS=5              // Minimum time (in minutes) between all dynamic events.
MINUTES_BETWEEN_EVENTS_OF_SAME_KIND=5     // Minimum time (in minutes) between dynamic events of the same kind (e.g., shop robberies).
MINUTES_BETWEEN_EVENTS_AT_SAME_PLACE=60   // Minimum time (in minutes) between dynamic events at the same location (e.g., a robbery at the same shop).
EVENT_DESPAWN_DISTANCE=200                // Distance (in units) at which dynamic events will despawn.
DISABLE_BLIPS=false                       // Disable blips for dynamic events
GANG_WAR_PARTICIPANT_BLIPS=false          // Enable blips for spawned gang members
INSTANTLY_START_EVENTS=false

[BodyMarkers]
ENABLED=true                              // Enable or disable body markers for downed NPCs.
HIDE_ON_DISTANCE=true                     // Hide body markers when they are far from the player.
DISTANCE_TO_HIDE=400                      // Distance (in units) at which body markers will be hidden.

[SecurityCameras]
ENABLED=true                              // Enable or disable security cameras.
CAN_STOP_REPORT=true                      // Player can stop reporting by shooting the camera.
REPORT_SECONDS=3                          // Time (in seconds) it takes for a security camera to report a crime.
DETECTION_DISTANCE=40                     // Distance (in units) that security cameras can detect the player.

[PedHud]
// Overlay HUD: health + morale bars drawn over enemies you aim at. Off by default.
// Requires Windowed or Windowed-Borderless (the overlay is invisible in exclusive fullscreen).
ENABLED=false                            // Enable the aim-to-inspect health/morale bars overlay.
MAX_DISTANCE=60                          // Cull enemies farther than this (metres) from the player.
AIM_CONE_DEGREES=14                      // Half-angle around your aim within which non-targeted enemies also get bars.
REFERENCE_DISTANCE=10                    // Distance (metres) at which a bar renders at full size.
MIN_SCALE=0.45                           // Smallest bar scale (far enemies).
MAX_SCALE=1.5                            // Largest bar scale (close enemies).
PUSH_INTERVAL_MS=50                      // Overlay refresh throttle in ms (~20Hz).
REQUIRE_LINE_OF_SIGHT=true               // Hide bars for enemies fully behind geometry.

