[CopScenarios]
ENABLED=true
NIGHT_START_HOUR=20   // Night window start (24h). A scenario can start when the hour is >= this OR < NIGHT_END_HOUR.
NIGHT_END_HOUR=5
STATIC_HOTSPOT_RADIUS=200   // Radius (metres) of each static hood hotspot, used only when Hoodcore territory data is unavailable.
SPAWN_TRIGGER_DISTANCE=70   // How close (metres) the player must get to an anchor before a scenario spawns in.
WITNESS_RADIUS=45   // Metres from the staged stop the player must reach before the resolution outcome begins.
MAX_IDLE_SECONDS=120   // Seconds the stop idles unwitnessed before tearing down silently. 0 disables the timeout.
OUTCOME_WEIGHT_PEACEFUL=60   // Outcome weight (relative): peaceful release. Most common.
OUTCOME_WEIGHT_ARREST=20   // Outcome weight (relative): driver arrested.
OUTCOME_WEIGHT_FLEES=12   // Outcome weight (relative): driver flees.
OUTCOME_WEIGHT_SHOOTOUT=8   // Outcome weight (relative): shootout. Rarest.
